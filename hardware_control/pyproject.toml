[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware_control"
version = "0.1.0"
description = "GLINT hardware control: DM and chip-mount drivers"
requires-python = ">=3.8"
dependencies = ["numpy", "pyserial"]

[tool.setuptools.packages.find]
include = ["hardware_control*"]

[tool.setuptools.package-data]
"hardware_control.dmcontrol" = ["flats/*.txt", "bmc/*.so", "bmc/*.mat", "bmc/*.txt"]
